name: ASDUCK Session Tokens + Pages

on:
  workflow_dispatch:
  # V11.11: every trusted local push to main may be a parentless force-pushed
  # root snapshot. Do not rely on GitHub path-diff evaluation for unrelated roots.
  push:
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'

concurrency:
  group: asduck-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Reject plaintext protected payloads
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- revoked.json security.json update.json session_registry.json scripts/generate-session-tokens.mjs || true)"
          if [ -n "$tracked" ]; then
            echo "Plaintext protected payload tracked in repository:" >&2
            echo "$tracked" >&2
            exit 1
          fi

      - name: Decrypt protected repository payloads
        shell: bash
        env:
          ASDUCK_REPO_PAYLOAD_KEY_B64: ${{ secrets.ASDUCK_REPO_PAYLOAD_KEY_B64 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const keyB64 = (process.env.ASDUCK_REPO_PAYLOAD_KEY_B64 || '').trim();
          if (!keyB64) throw new Error('ASDUCK_REPO_PAYLOAD_KEY_B64 secret missing');
          const key = Buffer.from(keyB64, 'base64');
          if (key.length !== 32) throw new Error('Repo payload key must be 32 bytes');
          const aad = Buffer.from('ASDUCK-REPO-PAYLOAD-V2\n', 'utf8');
          const outDir = '.asduck-build';
          fs.rmSync(outDir, { recursive: true, force: true });
          fs.mkdirSync(outDir, { recursive: true });

          function b64url(s) {
            return Buffer.from(String(s).replace(/-/g, '+').replace(/_/g, '/') +
              '='.repeat((4 - String(s).length % 4) % 4), 'base64');
          }
          function decrypt(src, dst, required = true) {
            if (!fs.existsSync(src)) {
              if (required) throw new Error(`Protected payload missing: ${src}`);
              return;
            }
            const env = JSON.parse(fs.readFileSync(src, 'utf8'));
            if (env.V !== 2 || env.A !== 'A256GCM-P4096-K2')
              throw new Error(`Invalid protected envelope: ${src}`);
            const nonce = b64url(env.N), tag = b64url(env.T), cipher = b64url(env.C);
            if (nonce.length !== 12 || tag.length !== 16 || cipher.length < 4096 || (cipher.length % 4096) !== 0)
              throw new Error(`Invalid protected envelope lengths: ${src}`);
            const dec = crypto.createDecipheriv('aes-256-gcm', key, nonce, { authTagLength: 16 });
            dec.setAAD(aad);
            dec.setAuthTag(tag);
            const frame = Buffer.concat([dec.update(cipher), dec.final()]);
            const sizeBig = frame.readBigUInt64LE(0);
            if (sizeBig > BigInt(Number.MAX_SAFE_INTEGER) || sizeBig > BigInt(frame.length - 8))
              throw new Error(`Invalid framed plaintext length: ${src}`);
            const size = Number(sizeBig);
            const plain = Buffer.from(frame.subarray(8, 8 + size));
            fs.writeFileSync(dst, plain, { mode: 0o600 });
            plain.fill(0); frame.fill(0);
          }

          decrypt('revoked.enc.json', path.join(outDir, 'revoked.json'));
          decrypt('security.enc.json', path.join(outDir, 'security.json'));
          decrypt('update.enc.json', path.join(outDir, 'update.json'), false);
          decrypt('session_registry.enc.json', path.join(outDir, 'session_registry.json'));
          decrypt('scripts/generate-session-tokens.enc.json', path.join(outDir, 'generate-session-tokens.mjs'));
          if (fs.existsSync('CNAME')) fs.copyFileSync('CNAME', path.join(outDir, 'CNAME'));
          key.fill(0);
          NODE

      - name: Gate Pages on exact release asset
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .asduck-build/update.json ]; then
            echo "update.json not present; session/license-state publish does not change release asset."
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          const u = JSON.parse(fs.readFileSync('.asduck-build/update.json','utf8'));
          const version = String(u.Version || '');
          if (!/^\d+\.\d+\.\d+$/.test(version))
            throw new Error('Invalid update version');
          const expectedUrl = `https://github.com/ASKERSAVAS/asduck-license/releases/download/v${version}/ASDUCK.exe`;
          if (String(u.Url || '') !== expectedUrl)
            throw new Error('Unexpected update release URL');
          if (!/^[A-F0-9]{64}$/.test(String(u.Sha256||'')) || !Number.isSafeInteger(u.Size) || u.Size < 1)
            throw new Error('Invalid update asset identity');
          let last='';
          for (let i=1;i<=100;i++) {
            try {
              cp.execFileSync('curl',['-fL','--retry','2','--retry-delay','1','-H','Cache-Control: no-cache','-o','.asduck-build/release-ASDUCK.exe',u.Url],{stdio:'ignore'});
              const b=fs.readFileSync('.asduck-build/release-ASDUCK.exe');
              const h=crypto.createHash('sha256').update(b).digest('hex').toUpperCase();
              last=`${h}/${b.length}`;
              if (h===u.Sha256 && b.length===u.Size) { console.log(`Release asset gate PASS ${last}`); process.exit(0); }
            } catch (e) { last=String(e.message||e); }
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)),0,0,3000);
          }
          throw new Error(`Release asset did not converge to update manifest: ${last}`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate signed short-lived session tokens
        working-directory: .asduck-build
        env:
          ASDUCK_SESSION_PRIVATE_KEY_B64: ${{ secrets.ASDUCK_SESSION_PRIVATE_KEY_B64 }}
          ASDUCK_SESSION_REGISTRY: session_registry.json
          ASDUCK_PAGES_OUT: ../_site
        run: node generate-session-tokens.mjs

      - name: Destroy decrypted build payloads
        if: always()
        shell: bash
        run: rm -rf .asduck-build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
