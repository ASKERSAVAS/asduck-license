name: ASDUCK Session Tokens + Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'revoked.json'
      - 'security.json'
      - 'update.json'
      - 'session_registry.json'
      - 'session_public_key.b64'
      - 'scripts/generate-session-tokens.mjs'
      - '.github/workflows/asduck-session-pages.yml'
  schedule:
    - cron: '2-57/5 * * * *'

concurrency:
  group: asduck-session-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate required public state
        shell: bash
        run: |
          set -euo pipefail
          test -f revoked.json
          test -f security.json
          test -f update.json
          test -f session_registry.json
          test -f session_public_key.b64
          test -f scripts/generate-session-tokens.mjs

      - name: Generate signed short-lived session tokens
        env:
          ASDUCK_SESSION_PRIVATE_KEY_B64: ${{ secrets.ASDUCK_SESSION_PRIVATE_KEY_B64 }}
          ASDUCK_SESSION_REGISTRY: session_registry.json
          ASDUCK_SESSION_PUBLIC_KEY: session_public_key.b64
          ASDUCK_PAGES_OUT: _site
        run: node scripts/generate-session-tokens.mjs

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
